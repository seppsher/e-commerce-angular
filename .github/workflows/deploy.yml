name: Deploy Angular 22 to GitHub Pages

on:
  push:
    branches: ['main']

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Configure payment remote URL
        env:
          PAYMENT_REMOTE_URL: ${{ vars.PAYMENT_REMOTE_URL }}
        run: |
          if [ -z "$PAYMENT_REMOTE_URL" ]; then
            echo "PAYMENT_REMOTE_URL GitHub Actions variable is not configured"
            exit 1
          fi
          node -e "const fs = require('fs'); const path = 'public/federation.manifest.json'; const manifest = JSON.parse(fs.readFileSync(path, 'utf8')); manifest['payment-remote'] = process.env.PAYMENT_REMOTE_URL.replace(/\\/$/, '') + '/remoteEntry.json'; fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\\n');"

      - name: Build Angular app
        run: npm run build -- --configuration production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/e-commerce-angular/browser/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
