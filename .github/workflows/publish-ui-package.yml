name: Publish private UI package

on:
  push:
    tags:
      - 'seepsher-ui-v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          registry-url: https://npm.pkg.github.com
          scope: '@seppsher'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build UI package
        run: npm run build:ui

      - name: Verify release tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./projects/seepsher-ui/package.json').version")
          if [ "$GITHUB_REF_NAME" != "seepsher-ui-v$PACKAGE_VERSION" ]; then
            echo "Tag must match package version: seepsher-ui-v$PACKAGE_VERSION"
            exit 1
          fi

      - name: Publish package
        run: npm publish ./projects/seepsher-ui/dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
